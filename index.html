<!DOCTYPE html>
<!--
  MXX CHAT (mxx-uz loyihasi) — bitta fayl (mxx01). Firebase kaliti ichida.
  FIRESTORE QOIDALARI: Firebase Console → Firestore → Rules ga ESKISINI O'CHIRIB shuni qo'ying → Publish:

rules_version = '2';
service cloud.firestore { match /databases/{d}/documents {
  function ok() { return request.auth != null; }
  function C(c) { return get(/databases/$(d)/documents/chats/$(c)).data; }
  function mem(c) { return request.auth.uid in C(c).members; }
  match /logins/{u} {
    allow get: if true;
    allow create: if ok() && request.resource.data.uid == request.auth.uid
                  && request.resource.data.email == request.auth.token.email;
    allow delete: if ok() && (resource == null || resource.data.uid == request.auth.uid);
  }
  match /usernames/{u} {
    allow read: if ok();
    allow create: if ok() && request.resource.data.owner == request.auth.uid
                  && request.resource.data.type in ['user', 'room'];
    allow delete: if ok() && (resource == null || resource.data.owner == request.auth.uid);
  }
  match /users/{id} {
    allow read: if ok();
    allow create, update: if ok() && id == request.auth.uid;
    allow delete: if ok() && id == request.auth.uid;
  }
  match /chats/{c} {
    allow read: if ok() && (request.auth.uid in resource.data.members
                            || resource.data.get('username', '') != '');
    allow create: if ok() && request.auth.uid in request.resource.data.members
      && ((request.resource.data.type == 'dm' && request.resource.data.members.size() == 2)
       || (request.resource.data.type in ['group', 'channel'] && request.resource.data.owner == request.auth.uid));
    allow update: if ok() && (
      // 1) a'zo: oxirgi xabar, yozmoqda, o'qilganlar
      (request.auth.uid in resource.data.members
        && request.resource.data.members == resource.data.members
        && request.resource.data.diff(resource.data).affectedKeys()
             .hasOnly(['last', 'lts', 'lfrom', 'typing', 'reads', 'unread', 'cts']))
      // 2) shaxsiy chatda mahkamlash
      || (resource.data.type == 'dm'
        && request.auth.uid in resource.data.members
        && request.resource.data.members == resource.data.members
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pinned']))
      // 3) EGA: hamma narsa (admin tayinlash va teg qo'yish faqat egada)
      || (request.auth.uid == resource.data.get('owner', '')
        && request.resource.data.owner == resource.data.owner
        && request.resource.data.type == resource.data.type)
      // 4) ADMIN: nom, rasm, tavsif, a'zolar, mahkamlash. Admin/teg o'zgartira olmaydi, egani chiqara olmaydi
      || (request.auth.uid in resource.data.get('admins', [])
        && request.resource.data.owner == resource.data.owner
        && request.resource.data.type == resource.data.type
        && request.resource.data.members.hasAll([resource.data.owner])
        && request.resource.data.get('admins', []) == resource.data.get('admins', [])
        && request.resource.data.get('tags', {}) == resource.data.get('tags', {}))
      // 5) ochiq guruh/kanalga qo'shilish
      || (resource.data.get('username', '') != ''
        && request.resource.data.members.hasAll(resource.data.members)
        && request.auth.uid in request.resource.data.members
        && request.resource.data.members.size() == resource.data.members.size() + 1
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['members']))
      // 6) chiqib ketish
      || (request.auth.uid in resource.data.members
        && !(request.auth.uid in request.resource.data.members)
        && resource.data.members.hasAll(request.resource.data.members)
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['members', 'admins']))
    );
    allow delete: if ok() && (resource.data.get('owner', '') == request.auth.uid
                              || (resource.data.type == 'dm' && request.auth.uid in resource.data.members));
    match /msgs/{m} {
      allow read: if ok() && mem(c);
      allow create: if ok() && mem(c) && request.resource.data.from == request.auth.uid
        && (C(c).type != 'channel' || request.auth.uid in C(c).admins)
        && request.resource.data.ts == request.time
        && request.resource.data.keys().hasOnly(['from', 'ts', 't', 'img', 'reply', 'fwd'])
        && request.resource.data.get('t', '').size() <= 4000;
      allow update: if ok() && (
        (resource.data.from == request.auth.uid
          && request.resource.data.from == request.auth.uid
          && request.resource.data.ts == resource.data.ts
          && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['reacts']))
        || (mem(c)
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['reacts'])
          && request.resource.data.get('reacts', {}).diff(resource.data.get('reacts', {}))
               .affectedKeys().hasOnly([request.auth.uid]))
      );
      allow delete: if ok() && (resource.data.from == request.auth.uid
                                || request.auth.uid in C(c).get('admins', [])
                                || (C(c).type == 'dm' && mem(c)));
    }
  }
} }
-->

<style>

*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}

.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;background-size:cover;background-position:center;flex:none;position:relative}
.on::after{content:"";position:absolute;right:0;bottom:0;width:28%;height:28%;border-radius:50%;background:var(--ok);border:2px solid var(--sf)}
.btn{background:var(--g);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(106,92,255,.38);filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;transform:none;box-shadow:none;cursor:default}
.btn.g{background:var(--in);color:var(--ink)}.btn.g:hover{box-shadow:none;filter:brightness(.95)}
.btn.d{background:var(--bad)}
.btn.sp::after{content:"";width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.lnk{color:var(--ac);font-size:14px;text-align:left;padding:2px 0;font-weight:500}.lnk:hover{text-decoration:underline}
.err,.okm{font-size:14px;min-height:1.2em}.err{color:var(--bad)}.okm{color:var(--ok)}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--mut)}
input:not([type=checkbox]):not([type=file]),textarea{padding:11px 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--in);color:var(--ink);resize:none;transition:border-color .15s,box-shadow .15s,background .15s;width:100%}

#list{overflow:auto;flex:1;padding:0 8px 80px}

.tag{font-size:12px;color:var(--mut);font-weight:400}
.fab{position:absolute;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;font-size:24px;box-shadow:0 10px 26px rgba(106,92,255,.5);transition:transform .2s}
.fab:hover{transform:scale(1.1) rotate(8deg)}.fab:active{transform:scale(.94)}

.hd{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--ln)}
.hl{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:4px 8px;border-radius:14px;transition:background .15s}

.hl div{min-width:0;line-height:1.25}.hl b{display:block}.hl small{color:var(--mut)}
#bk{display:none}
#msgs{flex:1;overflow:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(var(--ln) 1.2px,transparent 1.2px);background-size:22px 22px;position:relative}

.acts button:hover{background:var(--in);transform:translateY(-2px)}
.acts button i{font-style:normal;font-size:22px}
.acts .dg{color:var(--bad)}
.card{background:var(--sf);border-radius:20px;margin:0 14px 14px;overflow:hidden}
.il{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;border-bottom:1px solid var(--ln)}
.il:last-child{border-bottom:0}
button.il:hover{background:var(--in)}
.il i{font-style:normal;width:26px;text-align:center;font-size:20px;color:var(--mut)}

.itabs button.a{background:var(--in);color:var(--ac)}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--ln);transition:background .15s}
.mrow:last-child{border-bottom:0}.mrow:hover{background:var(--in)}
.mrow .m{flex:1;min-width:0}
.mrow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow small.ol{color:var(--ac)}

.un{color:var(--ac);font-size:14px;white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.grid3 img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;display:block}
.lk{padding:10px 16px;border-bottom:1px solid var(--ln);overflow-wrap:anywhere}
.lk:last-child{border-bottom:0}.lk small{color:var(--mut);display:block}.lk a{color:var(--ac)}
.none{padding:22px;text-align:center;color:var(--mut)}

<script>
const CFG={apiKey:"AIzaSyDcggr79-p4FkQwibKEr0o7qsLaI3FJgjg",authDomain:"mxx-uz.firebaseapp.com",projectId:"mxx-uz",storageBucket:"mxx-uz.firebasestorage.app",messagingSenderId:"604085055246",appId:"1:604085055246:web:50e80616826a2ded8b315f",measurementId:"G-3KM57J5SXP"};
firebase.initializeApp(CFG);
const au=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue,FP=firebase.firestore.FieldPath.documentId();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const $=s=>document.querySelector(s);
const COL=['#6a5cff','#12b886','#f08c00','#d6336c','#0c8599','#7048e8'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lin=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const hue=s=>COL[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const av=(o,z=46,on)=>o.img?`<span class="av${on?' on':''}" style="width:${z}px;height:${z}px;background-image:url('${o.img}')"></span>`:`<span class="av${on?' on':''}" style="width:${z}px;height:${z}px;background:${hue(o.name||'?')};font-size:${z*.4}px">${esc((o.name||'?').trim().slice(0,1).toUpperCase())}</span>`;
const hm=t=>new Date(t).toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'});
const ts=c=>c.lts?.toMillis?.()||c.cts||0;
const norm=s=>s.trim().toLowerCase().replace(/^@/,'');
const okUn=u=>/^[a-z0-9_]{3,20}$/.test(u);
let U=null,ME=null,CH=[],M=[],cur=null,UC={},subs=[],unsubM=null,unsubP=null,mode='in',inited=false,lastN={},TH=localStorage.getItem('mxx.th')||'light',hb=null,TAB='all',REPLY=null,EDIT=null,lastType=0,REG=false,MUTE=[],PIN=[],DR={},SEL=new Set(),SELM=new Set(),LPF=0,LPT='mouse',INFO=null,ITAB='m';
try{MUTE=JSON.parse(localStorage.getItem('mxx.mute')||'[]')}catch(e){}
try{PIN=JSON.parse(localStorage.getItem('mxx.pin')||'[]')}catch(e){}
// 2 soniya bosib turish (Telegram kabi tanlash rejimi)
function lp(el,sel,fn){
 let t,sx,sy,fired=false;
 const stop=()=>{clearTimeout(t);el.querySelectorAll('.hold').forEach(x=>x.classList.remove('hold'))};
 el.addEventListener('pointerdown',e=>{
  fired=false;if(e.button>0)return;const tg=e.target.closest(sel);if(!tg)return;
  LPT=e.pointerType;sx=e.clientX;sy=e.clientY;stop();tg.classList.add('hold');
  t=setTimeout(()=>{fired=true;stop();if(navigator.vibrate)navigator.vibrate(35);fn(tg)},420)});
 el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)stop()});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,stop));
 el.addEventListener('click',e=>{if(fired){fired=false;e.stopPropagation();e.stopImmediatePropagation();e.preventDefault()}},true)
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
function theme(){document.documentElement.dataset.theme=TH;document.querySelector('meta[name=theme-color]').content=TH==='dark'?'#0a0d1c':'#6a5cff'}
const online=u=>u&&u.seen?.toMillis&&Date.now()-u.seen.toMillis()<100000;
const peer=c=>c.members.find(m=>m!==U);
function who(id){if(UC[id])return UC[id];UC[id]={name:'...'};db.doc('users/'+id).get().then(s=>{if(s.exists){UC[id]=s.data();renderList();const c=CH.find(x=>x.id===cur);if(c){head(c);renderMsgs()}}}).catch(()=>{});return UC[id]}
const info=c=>c.type==='dm'?who(peer(c)):c;
const unr=c=>c.unread?.[U]||0;
// ===== Kirish =====
const ERR={'auth/email-already-in-use':'Bu email allaqachon ro‘yxatdan o‘tgan.','auth/wrong-password':'Parol noto‘g‘ri.','auth/invalid-credential':'Email/nom yoki parol noto‘g‘ri.','auth/user-not-found':'Bunday hisob topilmadi.','auth/invalid-email':'Email manzili noto‘g‘ri.','auth/weak-password':'Parol kamida 6 belgidan iborat bo‘lsin.','auth/too-many-requests':'Juda ko‘p urinish. Birozdan so‘ng qayta urining.','auth/network-request-failed':'Internet aloqasi yo‘q.','auth/operation-not-allowed':'Firebase’da Email/Password yoqilmagan.','x/nouser':'Bunday foydalanuvchi nomi topilmadi.','x/in':'Barcha maydonlarni to‘ldiring.','x/name':'Ism kamida 2 harfdan iborat bo‘lsin.','x/un':'Foydalanuvchi nomi: 3–20 ta lotin harf, raqam yoki _.','x/taken':'Bu foydalanuvchi nomi band.','x/mail':'To‘g‘ri email kiriting.','x/pw':'Parol kamida 6 belgidan iborat bo‘lsin.','permission-denied':'Ruxsat yo‘q: Firestore qoidalarini Publish qilganingizni tekshiring.'};
function authUI(){
 $('#wn').hidden=$('#wu').hidden=mode!=='up';$('#wp').hidden=mode==='reset';$('#pst').hidden=mode!=='up';
 $('#le').textContent=mode==='up'?'Email':'Email yoki foydalanuvchi nomi';
 $('#ag').textContent={in:'Kirish',up:'Hisob yaratish',reset:'Tiklash havolasini yuborish'}[mode];
 $('#at').textContent={in:'Xush kelibsiz!',up:'Yangi hisob',reset:'Parolni tiklash'}[mode];
 $('#as').textContent={in:'Hisobingizga kiring va suhbatni davom ettiring.',up:'Bir daqiqada ro‘yxatdan o‘ting.',reset:'Emailingizga tiklash havolasini yuboramiz.'}[mode];
 $('#tb').hidden=mode==='reset';$('#a2').hidden=mode!=='in';$('#a1').hidden=mode!=='reset';
 document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('a',b.dataset.m===mode));
 $('#ae').textContent='';$('#fp').autocomplete=mode==='up'?'new-password':'current-password'
}
$('#tb').onclick=e=>{const m=e.target.dataset.m;if(m){mode=m;authUI()}};
$('#a2').onclick=()=>{mode='reset';authUI()};
$('#a1').onclick=()=>{mode='in';authUI()};
$('#eye').onclick=()=>{const p=$('#fp');p.type=p.type==='password'?'text':'password'};
$('#fp').oninput=()=>{const p=$('#fp').value;let s=0;if(p.length>=6)s++;if(p.length>=9)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p)&&/[^\w]/.test(p))s++;const i=$('#pst i');i.style.width=s*25+'%';i.style.background=['#e03131','#f08c00','#f2c600','#12b886'][Math.max(0,s-1)]};
async function loginMail(id){if(id.includes('@'))return id;const s=await db.doc('logins/'+id).get();if(!s.exists)throw{code:'x/nouser'};return s.data().email}
$('#af').onsubmit=async e=>{
 e.preventDefault();const er=$('#ae'),b=$('#ag');er.textContent='';er.className='err';
 const id=$('#fe').value.trim().toLowerCase().replace(/^@/,''),p=$('#fp').value;b.disabled=true;b.classList.add('sp');
 try{
  if(mode==='in'){if(!id||!p)throw{code:'x/in'};await au.signInWithEmailAndPassword(await loginMail(id),p)}
  else if(mode==='reset'){if(!id)throw{code:'x/in'};await au.sendPasswordResetEmail(await loginMail(id));er.className='okm';er.textContent='Tiklash havolasi emailingizga yuborildi. Spam papkasini ham tekshiring.'}
  else{
   const n=$('#fn').value.trim(),u=norm($('#fu').value);
   if(n.length<2)throw{code:'x/name'};if(!okUn(u))throw{code:'x/un'};
   if(!/^\S+@\S+\.\S+$/.test(id))throw{code:'x/mail'};if(p.length<6)throw{code:'x/pw'};
   if((await db.doc('logins/'+u).get()).exists)throw{code:'x/taken'};
   REG=true;
   const cr=await au.createUserWithEmailAndPassword(id,p),uid=cr.user.uid,bt=db.batch();
   bt.set(db.doc('logins/'+u),{uid,email:id});bt.set(db.doc('usernames/'+u),{type:'user',owner:uid,uid});
   bt.set(db.doc('users/'+uid),{uid,username:u,name:n,bio:'',img:'',seen:FV.serverTimestamp()});
   try{await bt.commit()}catch(x){await cr.user.delete().catch(()=>{});REG=false;throw{code:x.code==='permission-denied'?'x/taken':x.code}}
   REG=false
  }
 }catch(x){REG=false;er.textContent=ERR[x.code]||('Xatolik: '+(x.code||x.message))}
 b.disabled=false;b.classList.remove('sp')
};
// ===== Sessiya =====
function stop(){subs.forEach(f=>f());subs=[];if(unsubM)unsubM();if(unsubP)unsubP();unsubM=unsubP=null;clearInterval(hb)}
function beat(){if(U&&!document.hidden)db.doc('users/'+U).update({seen:FV.serverTimestamp()}).catch(()=>{})}
au.onAuthStateChanged(u=>{
 stop();$('#ld').hidden=true;
 if(!u){closeInfo();U=ME=null;DR={};SEL.clear();SELM.clear();$('#ci').value='';$('#lsel').hidden=true;$('#top').hidden=false;$('#hsel').hidden=true;$('#pnb').hidden=true;CH=[];UC={};lastN={};inited=false;cur=null;M=[];$('#app').hidden=true;$('#app').classList.remove('open');$('#hd').hidden=true;$('#cf').hidden=true;$('#msgs').innerHTML='<div class="emp">Chatni tanlang.</div>';$('#auth').hidden=false;authUI();document.title='MXX Chat';return}
 U=u.uid;
 subs.push(db.doc('users/'+U).onSnapshot(s=>{
  if(s.exists){ME=s.data();UC[U]=ME;$('#auth').hidden=true;$('#app').hidden=false}
  else if(!REG)setTimeout(()=>{if(!ME&&U&&!REG)db.doc('users/'+U).set({uid:U,username:'',name:(u.email||'Foydalanuvchi').split('@')[0],bio:'',img:'',seen:FV.serverTimestamp()},{merge:true}).catch(()=>{})},1500)
 }));
 subs.push(db.collection('chats').where('members','array-contains',U).onSnapshot(s=>{
  CH=s.docs.map(d=>({id:d.id,...d.data()}));
  CH.forEach(c=>{const t=ts(c),old=lastN[c.id]??(inited?0:t);
   if(inited&&t>old&&c.lfrom&&c.lfrom!==U&&(c.id!==cur||document.hidden)&&!MUTE.includes(c.id))notify(c.type==='dm'?who(c.lfrom).name:info(c).name+' · '+who(c.lfrom).name,c.last||'');
   lastN[c.id]=t});
  inited=true;
  const c=CH.find(x=>x.id===cur);
  if(c){if(unr(c)>0&&!document.hidden)markRead(c);head(c)}else if(cur)back();
  renderList();if(INFO)renderInfo()
 },()=>toast('Serverga ulanib bo‘lmadi')));
 beat();hb=setInterval(beat,60000);
 if(window.Notification&&Notification.permission==='default')document.addEventListener('click',()=>Notification.requestPermission(),{once:true})
});
document.addEventListener('visibilitychange',()=>{beat();const c=CH.find(x=>x.id===cur);if(c&&!document.hidden&&unr(c)>0)markRead(c)});
addEventListener('offline',()=>toast('Internet uzildi'));addEventListener('online',()=>toast('Ulandi'));
function markRead(c){db.doc('chats/'+c.id).update({['reads.'+U]:FV.serverTimestamp(),['unread.'+U]:0}).catch(()=>{})}
// ===== Bildirishnoma =====
function ping(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch(e){}}
async function notify(t,b){
 ping();
 if(document.hidden&&window.Notification&&Notification.permission==='granted'){
  try{const r=await navigator.serviceWorker?.getRegistration();if(r)r.showNotification(t,{body:b});else new Notification(t,{body:b})}catch(e){}
 }else toast(t+': '+b)
}
// ===== Chat ro'yxati =====
function renderList(){
 if(!U)return;
 for(const id of [...SEL])if(!CH.find(c=>c.id===id))SEL.delete(id);
 selUI();
 const f=$('#q').value.trim().toLowerCase();let tot=0;
 const cs=CH.filter(c=>(TAB==='all'||c.type===TAB)&&info(c).name.toLowerCase().includes(f)).sort((a,b)=>(PIN.includes(b.id)-PIN.includes(a.id))||ts(b)-ts(a));

    if(x.uid===U)return null;const u=(await db.doc('users/'+x.uid).get()).data();if(!u)return null;UC[x.uid]=u;return{k:'u',un:d.id,id:x.uid,u}}));
   L=out.filter(Boolean);
   r.innerHTML=L.length?L.map((o,i)=>{
    if(o.k==='u')return`<button class="row" data-i="${i}">${av(o.u)}<span class="m"><b><span>${esc(o.u.name)}</span></b><small>@${esc(o.un)}</small></span><span class="btn">Yozish</span></button>`;
    const mb=o.c.members.includes(U);
    return`<button class="row" data-i="${i}">${av(o.c)}<span class="m"><b><span>${esc(o.c.name)}</span><span class="tag">${o.c.type==='group'?'guruh':'kanal'}</span></b><small>@${esc(o.un)} · ${o.c.members.length} ${o.c.type==='group'?'a’zo':'obunachi'}</small></span><span class="btn">${mb?'Ochish':o.c.type==='group'?'Qo‘shilish':'Obuna'}</span></button>`}).join(''):'<p class="err">Hech narsa topilmadi.</p>'
  }catch(e){r.innerHTML='<p class="err">Qidirib bo‘lmadi. Internet va Firestore qoidalarini tekshiring.</p>'}
 },300)};
 $('#sr').onclick=async e=>{const b=e.target.closest('[data-i]');if(!b)return;const o=L[+b.dataset.i];
  if(o.k==='u')return dm(o.id);
  if(!o.c.members.includes(U)){try{await db.doc('chats/'+o.c.id).update({members:FV.arrayUnion(U)});toast(o.c.type==='group'?'Guruhga qo‘shildingiz':'Kanalga obuna bo‘ldingiz')}catch(x){return toast('Qo‘shilib bo‘lmadi')}}
  close();openSoon(o.c.id)}
}
function profile(){
 if(!ME)return;let img=ME.img||'';
 modal(`<h2>Profilim</h2><div class="pc"><span id="pv">${av({...ME,img},84)}</span><label class="btn g" style="cursor:pointer;color:var(--ink)">Rasm tanlash<input id="pf" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></label><button type="button" class="lnk" id="pr">Rasmni olib tashlash</button></div>
 <label>Ism<input id="pn" maxlength="30" value="${esc(ME.name)}"></label>
 <label>Foydalanuvchi nomi<input id="pu" maxlength="20" autocapitalize="none" value="${esc(ME.username||'')}" placeholder="username tanlang"></label>
 <label>Email<input value="${esc(au.currentUser.email)}" disabled></label>
 <label>Bio<textarea id="pb" maxlength="120" rows="2">${esc(ME.bio||'')}</textarea></label>
 <button type="button" class="lnk" id="pp">Parolni o‘zgartirish (emailga havola yuboriladi)</button>
 <p class="err" id="pe"></p><div class="ra"><button class="btn g" data-x>Bekor qilish</button><button class="btn" id="ps">Saqlash</button></div>`);
 const pv=()=>$('#pv').innerHTML=av({name:$('#pn').value||'?',img},84);
 $('#pn').oninput=pv;
 $('#pf').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,256,.8,d=>{if(d){img=d;pv()}},1)};
 $('#pr').onclick=()=>{img='';pv()};
 $('#pp').onclick=()=>au.sendPasswordResetEmail(au.currentUser.email).then(()=>toast('Havola emailingizga yuborildi')).catch(()=>toast('Yuborib bo‘lmadi'));
 $('#ps').onclick=async()=>{
  const n=$('#pn').value.trim(),u=norm($('#pu').value),old=ME.username||'',er=$('#pe'),bt=$('#ps');er.textContent='';
  if(n.length<2)return er.textContent='Ism kamida 2 harfdan iborat bo‘lsin.';
  if(u&&!okUn(u))return er.textContent=ERR['x/un'];
  if(!u&&old)return er.textContent='Username’ni bo‘sh qoldirib bo‘lmaydi.';
  bt.disabled=true;bt.classList.add('sp');
  try{
   const b=db.batch();
   if(u!==old){
    if((await db.doc('logins/'+u).get()).exists||(await db.doc('usernames/'+u).get()).exists){er.textContent=ERR['x/taken'];bt.disabled=false;bt.classList.remove('sp');return}
    if(old){b.delete(db.doc('logins/'+old));b.delete(db.doc('usernames/'+old))}
    b.set(db.doc('logins/'+u),{uid:U,email:au.currentUser.email.toLowerCase()});b.set(db.doc('usernames/'+u),{type:'user',owner:U,uid:U})
   }
   b.update(db.doc('users/'+U),{name:n,username:u,bio:$('#pb').value.trim(),img});
   await b.commit();close();toast('Profil saqlandi')
  }catch(x){er.textContent='Saqlab bo‘lmadi: '+(ERR[x.code]||x.code||x.message);bt.disabled=false;bt.classList.remove('sp')}
 }
}
function muteTog(id){const i=MUTE.indexOf(id);i<0?MUTE.push(id):MUTE.splice(i,1);localStorage.setItem('mxx.mute',JSON.stringify(MUTE));renderList();return i<0}
const seenTxt=u=>{
 if(online(u))return'onlayn';const t=u?.seen?.toMillis?.();if(!t)return'yaqinda onlayn edi';
 const d=new Date(t),n=new Date(),dd=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
 return dd<=0?'oxirgi marta: '+hm(t)+' da':dd===1?'oxirgi marta: kecha '+hm(t)+' da':'oxirgi marta: '+d.toLocaleDateString('uz',{day:'numeric',month:'long'})
};
const tagOf=(c,id)=>(c.tags?.[id]||'').trim()||(id===c.owner?'Ega':c.admins?.includes(id)?'admin':'');
function openInfo(c){INFO=c.id;ITAB=c.type==='dm'?'media':'m';$('#info').hidden=false;renderInfo();$('#info').scrollTop=0}
function closeInfo(){INFO=null;const e=$('#info');if(e){e.hidden=true;e.innerHTML=''}}
function renderInfo(){
 const c=CH.find(x=>x.id===INFO),box=$('#info');if(!c)return closeInfo();
 const dm=c.type==='dm',g=c.type==='group',own=c.owner===U,adm=!!c.admins?.includes(U),mu=MUTE.includes(c.id),i=info(c);
 const imgs=M.filter(x=>x.img).reverse(),lks=M.filter(x=>x.t&&/https?:\/\//.test(x.t)).reverse();
 const sub=dm?seenTxt(i):c.members.length+' ta '+(g?'a’zo':'obunachi');
 const tabs=dm?[['media','Media'],['links','Havolalar']]:[['m',g?'A’zolar':'Obunachilar'],['media','Media'],['links','Havolalar']];
 if(!tabs.some(t=>t[0]===ITAB))ITAB=tabs[0][0];
 let body='';
 if(ITAB==='m'){
  const rk=id=>id===c.owner?0:c.admins?.includes(id)?1:2;
  const ms=c.members.map(id=>[id,who(id)]).sort((a,b)=>rk(a[0])-rk(b[0])||(online(b[1])?1:0)-(online(a[1])?1:0)||(b[1].seen?.toMillis?.()||0)-(a[1].seen?.toMillis?.()||0));
  body=`<div class="card">${ms.map(([id,u])=>{const t=tagOf(c,id);
   return`<button class="mrow" data-m="${id}">${av(u,46,online(u))}<span class="m"><b>${esc(u.name)}${id===U?' (siz)':''}</b><small class="${online(u)?'ol':''}">${esc(seenTxt(u))}</small></span>${t?`<span class="pill${id===c.owner?' o':''}">${esc(t)}</span>`:u.username?`<span class="un">@${esc(u.username)}</span>`:''}</button>`}).join('')}</div>`
 }else if(ITAB==='media'){
  body=imgs.length?`<div class="card"><div class="grid3">${imgs.map(x=>`<img src="${x.img}" alt="Rasm" loading="lazy">`).join('')}</div></div>`:'<div class="card"><div class="none">Hali rasm yo‘q</div></div>'
 }else{
  body=lks.length?`<div class="card">${lks.map(x=>`<div class="lk">${lin(x.t)}<small>${esc(who(x.from).name)} · ${new Date(x.ts?.toMillis?.()||Date.now()).toLocaleDateString('uz',{day:'numeric',month:'long'})}</small></div>`).join('')}</div>`:'<div class="card"><div class="none">Hali havola yo‘q</div></div>'
 }
 const un=dm?i.username:c.username,ds=dm?i.bio:c.description;
 const top=(un||ds)?`<div class="card">${un?`<div class="il"><i>@</i><span><b>@${esc(un)}</b><small>Foydalanuvchi nomi</small></span></div>`:''}${ds?`<div class="il"><i>ℹ️</i><span>${esc(ds)}<small>${dm?'Bio':'Tavsif'}</small></span></div>`:''}</div>`:'';
 const last=dm||own?`<button class="dg" data-a="del"><i>🗑</i>O‘chirish</button>`:`<button class="dg" data-a="leave"><i>↩</i>Tark etish</button>`;
 box.innerHTML=`<div class="ih"><button class="ib" data-a="back" aria-label="Orqaga">←</button><span class="sp"></span>${!dm&&adm?'<button class="ib" data-a="edit" aria-label="Tahrirlash">✎</button>':''}</div>
 <div class="hero2"><span data-a="avatar">${av(i,120,dm&&online(i))}</span><h2>${esc(i.name)}</h2><small>${esc(sub)}</small>${dm?'':`<small>Ega: ${esc(who(c.owner).name)}</small>`}</div>
 <div class="acts"><button data-a="msg"><i>💬</i>Xabar</button><button data-a="mute"><i>${mu?'🔔':'🔕'}</i>${mu?'Ovozni yoqish':'Sukut qilish'}</button>${last}</div>
 ${top}
 <div class="card"><button class="il" data-k="media"><i>🖼</i><span>Rasmlar</span><b>${imgs.length}</b></button><button class="il" data-k="links"><i>🔗</i><span>Havolalar</span><b>${lks.length}</b></button>${!dm&&adm?`<button class="il" data-a="add"><i>👤</i><span>${g?'A’zo':'Obunachi'} qo‘shish</span></button>`:''}</div>
 <div class="itabs">${tabs.map(([k,l])=>`<button data-k="${k}"${k===ITAB?' class="a"':''}>${l}</button>`).join('')}</div>
 ${body}`
}
$('#info').onclick=async e=>{
 const c=CH.find(x=>x.id===INFO);if(!c)return;
 const im=e.target.closest('.grid3 img');
 if(im){modal(`<img class="lb" src="${im.src}" alt="Rasm"><div class="ra"><button class="btn g" data-x>Yopish</button></div>`);return}
 const t=e.target.closest('[data-k],[data-a],[data-m]');if(!t)return;
 if(t.dataset.k){ITAB=t.dataset.k;renderInfo();return}
 if(t.dataset.m){const id=t.dataset.m;if(id===U&&c.owner!==U)return;memberMenu(c,id);return}
 const a=t.dataset.a,dm=c.type==='dm';
 if(a==='back'||a==='msg')closeInfo();
 else if(a==='avatar'){const x=info(c).img;if(x)modal(`<img class="lb" src="${x}" alt="Rasm"><div class="ra"><button class="btn g" data-x>Yopish</button></div>`)}
 else if(a==='mute'){toast(muteTog(c.id)?'Ovozsiz qilindi':'Ovoz yoqildi');renderInfo()}
 else if(a==='add')addMember(c);
 else if(a==='edit')editRoom(c);
 else if(a==='del'){
  if(!confirm(dm?'Chat ikkala tomon uchun ham o‘chadi. Davom etasizmi?':'Butunlay o‘chirilsinmi?'))return;
  try{await wipeMsgs(c.id);const b=db.batch();if(c.username)b.delete(db.doc('usernames/'+c.username));b.delete(db.doc('chats/'+c.id));await b.commit();toast('O‘chirildi')}catch(x){toast('O‘chirib bo‘lmadi')}
 }
 else if(a==='leave'){
  if(!confirm('Chiqasizmi?'))return;
  try{await db.doc('chats/'+c.id).update({members:FV.arrayRemove(U),admins:FV.arrayRemove(U)});toast('Chiqdingiz')}catch(x){toast('Chiqib bo‘lmadi')}
 }
};
function memberMenu(c,id){
 const u=who(id),own=c.owner===U,adm=!!c.admins?.includes(U),isA=!!c.admins?.includes(id),me=id===U;
 const canRm=!me&&id!==c.owner&&(own||(adm&&!isA));
 modal(`<div class="hero">${av(u,84,online(u))}<h2>${esc(u.name)}</h2><small style="color:var(--mut)">${u.username?'@'+esc(u.username)+' · ':''}${esc(seenTxt(u))}</small></div>
 <div class="ra" style="flex-direction:column;align-items:stretch">
 ${me?'':'<button class="btn g" id="mw">💬 Xabar yozish</button>'}
 ${own&&!me?`<button class="btn g" id="ma">${isA?'⭐ Adminlikdan olish':'⭐ Admin qilish'}</button>`:''}
 ${own?'<button class="btn g" id="mt">🏷 Teg qo‘yish</button>':''}
 ${canRm?'<button class="btn d" id="mr">🚫 Chiqarish</button>':''}
 <button class="btn" data-x>Yopish</button></div>`);
 const ref=db.doc('chats/'+c.id);
 if($('#mw'))$('#mw').onclick=()=>dm(id);
 if($('#ma'))$('#ma').onclick=async()=>{try{await ref.update({admins:isA?FV.arrayRemove(id):FV.arrayUnion(id)});close();toast(isA?'Adminlik olib tashlandi':'Admin qilindi')}catch(x){toast('Bajarib bo‘lmadi')}};
 if($('#mr'))$('#mr').onclick=async()=>{if(!confirm('Chiqarilsinmi?'))return;try{await ref.update({members:FV.arrayRemove(id),admins:FV.arrayRemove(id),['tags.'+id]:FV.delete()});close();toast('Chiqarildi')}catch(x){toast('Chiqarib bo‘lmadi')}};
 if($('#mt'))$('#mt').onclick=()=>{
  modal(`<h2>Teg · ${esc(u.name)}</h2><label>Teg (masalan: Moderator)<input id="tg" maxlength="16" value="${esc(c.tags?.[id]||'')}" placeholder="${esc(id===c.owner?'Ega':isA?'admin':'Teg yo‘q')}"></label><p class="err" id="te"></p><div class="ra"><button class="btn g" data-x>Bekor qilish</button><button class="btn" id="ts">Saqlash</button></div>`);
  $('#ts').onclick=async()=>{const v=$('#tg').value.trim().slice(0,16);try{await ref.update({['tags.'+id]:v||FV.delete()});close();toast(v?'Teg qo‘yildi':'Teg olib tashlandi')}catch(x){$('#te').textContent='Saqlab bo‘lmadi.'}}
 }
}
function addMember(c){
 modal(`<h2>${c.type==='group'?'A’zo':'Obunachi'} qo‘shish</h2><label>Foydalanuvchi nomi<input id="am" autocapitalize="none" placeholder="@username"></label><p class="err" id="ae2"></p><div class="ra"><button class="btn g" data-x>Bekor qilish</button><button class="btn" id="ak">Qo‘shish</button></div>`);
 $('#ak').onclick=async()=>{const u=norm($('#am').value),er=$('#ae2');if(!okUn(u))return er.textContent=ERR['x/un'];
  try{const s=await db.doc('usernames/'+u).get();if(!s.exists||s.data().type!=='user')return er.textContent='Bunday foydalanuvchi topilmadi.';
   await db.doc('chats/'+c.id).update({members:FV.arrayUnion(s.data().uid)});close();toast('Qo‘shildi')}catch(e){er.textContent='Qo‘shib bo‘lmadi.'}}
}
function editRoom(c){
 const own=c.owner===U;let img=c.img||'';
 modal(`<h2>Tahrirlash</h2>
 <div class="pc2"><span id="rv">${av({name:c.name,img},84)}</span><label class="btn g" style="cursor:pointer;color:var(--ink)">Rasm tanlash<input id="rf" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></label><button type="button" class="lnk" id="rr">Olib tashlash</button></div>
 <label>Nomi<input id="en" maxlength="40" value="${esc(c.name)}"></label>
 <label>Username${own?'':' (faqat egasi o‘zgartiradi)'}<input id="eu" autocapitalize="none" value="${esc(c.username||'')}" ${own?'':'disabled'}></label>
 <label>Tavsif<textarea id="ed" rows="3" maxlength="200">${esc(c.description||'')}</textarea></label>
 <p class="err" id="ee"></p><div class="ra"><button class="btn g" data-x>Bekor qilish</button><button class="btn" id="es">Saqlash</button></div>`);
 const rv=()=>$('#rv').innerHTML=av({name:$('#en').value||'?',img},84);
 $('#en').oninput=rv;
 $('#rf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)shrink(f,256,.8,d=>{if(d){img=d;rv()}},1)};
 $('#rr').onclick=()=>{img='';rv()};
 $('#es').onclick=async()=>{
  const n=$('#en').value.trim(),u=own?norm($('#eu').value):(c.username||''),old=c.username||'',er=$('#ee');
  if(!n)return er.textContent='Nomini kiriting.';if(u&&!okUn(u))return er.textContent=ERR['x/un'];
  try{const b=db.batch();
   if(u!==old){
    if(u&&(await db.doc('usernames/'+u).get()).exists)return er.textContent=ERR['x/taken'];
    if(old)b.delete(db.doc('usernames/'+old));
    if(u)b.set(db.doc('usernames/'+u),{type:'room',owner:U,rid:c.id})
   }
   b.update(db.doc('chats/'+c.id),{name:n,username:u,description:$('#ed').value.trim(),img});
   await b.commit();close();toast('Saqlandi')
  }catch(e){er.textContent='Saqlab bo‘lmadi: '+(e.code||e.message)}}
}
function mk(type){
 const g=type==='group';
 modal(`<h2>${g?'Guruh yaratish':'Kanal yaratish'}</h2><label>Nomi<input id="gn" maxlength="40"></label>
 <label>Username (ixtiyoriy — qo‘ysangiz hamma qidirib topadi)<input id="gu" autocapitalize="none" placeholder="masalan, mxx_yangiliklar"></label>
 <label>Tavsif (ixtiyoriy)<textarea id="gd" rows="2" maxlength="200"></textarea></label>
 ${g?'<label>A’zolar (username, vergul bilan)<input id="gm" autocapitalize="none" placeholder="aziza, jasur"></label>':''}
 <p class="err" id="ge"></p><div class="ra"><button class="btn g" data-x>Bekor qilish</button><button class="btn" id="gs">Yaratish</button></div>`);
 $('#gs').onclick=async()=>{
  const n=$('#gn').value.trim(),u=norm($('#gu').value),e=$('#ge');
  if(!n)return e.textContent='Nomini kiriting.';if(u&&!okUn(u))return e.textContent=ERR['x/un'];
  const bt=$('#gs');bt.disabled=true;bt.classList.add('sp');
  try{
   if(u&&(await db.doc('usernames/'+u).get()).exists){e.textContent=ERR['x/taken'];bt.disabled=false;bt.classList.remove('sp');return}
   const ids=[];
   if(g)for(const x of [...new Set($('#gm').value.split(/[\s,]+/).map(norm).filter(Boolean))]){
    const s=await db.doc('usernames/'+x).get();if(!s.exists||s.data().type!=='user'){e.textContent='@'+x+' topilmadi.';bt.disabled=false;bt.classList.remove('sp');return}
    if(s.data().uid!==U)ids.push(s.data().uid)}
   const r=db.collection('chats').doc(),b=db.batch();
   b.set(r,{type,name:n,username:u,description:$('#gd').value.trim(),owner:U,admins:[U],members:[U,...ids],cts:Date.now()});
   if(u)b.set(db.doc('usernames/'+u),{type:'room',owner:U,rid:r.id});
   await b.commit();close();toast(g?'Guruh yaratildi':'Kanal yaratildi');openSoon(r.id)
  }catch(x){e.textContent='Yaratib bo‘lmadi: '+(ERR[x.code]||x.code||x.message);bt.disabled=false;bt.classList.remove('sp')}
 }
}
$('#hi').onclick=$('#hm').onclick=()=>{const c=CH.find(x=>x.id===cur);if(c)openInfo(c)};
$('#nb').onclick=$('#fb').onclick=find;
$('#mb').onclick=e=>{e.stopPropagation();$('#menu').hidden=!$('#menu').hidden};

};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
theme();authUI();
setTimeout(()=>{$('#ld').hidden=true;if(!U&&$('#app').hidden)$('#auth').hidden=false},4000);
</script>
