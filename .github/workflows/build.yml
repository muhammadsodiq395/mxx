name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web fayllarni tayyorlash
        run: |
          mkdir www
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www' --exclude='package*.json' --exclude='capacitor.config.json' ./ www/
      - run: npm install
      - name: Pluginlar (orqaga tugmasi va bildirishnoma)
        run: |
          V=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/app@$V @capacitor/local-notifications@$V
      - run: npx cap add android
      - name: Ruxsatlar
        run: |
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA READ_MEDIA_IMAGES READ_MEDIA_VIDEO POST_NOTIFICATIONS; do
            sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n<application#" android/app/src/main/AndroidManifest.xml
          done
      - run: npx cap sync android
      - name: Ikonka
        run: |
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          convert icon-512.png -fuzz 8% -trim +repage sq.png
          sed -i 's/#FFFFFF/#2D9CF0/I' $R/values/ic_launcher_background.xml
          for e in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n a f <<< "$e"
            s=$((f*64/100))
            convert sq.png -resize ${a}x${a} -background '#2D9CF0' -gravity center -extent ${a}x${a} $R/mipmap-$n/ic_launcher.png
            convert sq.png -resize ${a}x${a} -background '#2D9CF0' -gravity center -extent ${a}x${a} $R/mipmap-$n/ic_launcher_round.png
            convert sq.png -resize ${s}x${s} -background none -gravity center -extent ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
      - name: Versiya raqami
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Release build
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Imzolash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > $RUNNER_TEMP/mxx.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$U" aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/mxx.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out mxx-release.apk aligned.apk
          $BT/apksigner verify --print-certs mxx-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mxx-app
          path: mxx-release.apk
          
